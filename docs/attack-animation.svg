<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a" />
      <stop offset="100%" style="stop-color:#1a1a3e" />
    </linearGradient>
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a5f" />
      <stop offset="100%" style="stop-color:#2d5a8a" />
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444" />
      <stop offset="100%" style="stop-color:#cc0000" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.2); } }
      @keyframes moveDown { 0% { transform: translateY(0); opacity: 1; } 70% { opacity: 1; } 100% { transform: translateY(350px); opacity: 0; } }
      @keyframes glow { 0%, 100% { filter: url(#glow); } 50% { filter: none; } }
      @keyframes scanline { 0% { transform: translateY(-5px); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.8; } 100% { transform: translateY(350px); opacity: 0; } }
      .layer-text { fill: #e0e0e0; font-family: 'Courier New', monospace; font-size: 11px; }
      .title { fill: #ffffff; font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; }
      .attack-dot { animation: moveDown 4s infinite; }
      .scan-line { animation: scanline 3s infinite; }
      .target-pulse { animation: pulse 2s infinite; }
    </style>
  </defs>

  <rect width="800" height="400" fill="url(#bg)" />

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">ANGEL Platform — 70-Layer Attack Surface</text>
  <text x="400" y="52" text-anchor="middle" fill="#888" font-family="Arial" font-size="12">Real-time Cross-Module Event Bus Orchestration</text>

  <!-- Layer columns -->
  <rect x="50" y="70" width="100" height="35" rx="5" fill="url(#layerGrad)" />
  <text x="100" y="92" text-anchor="middle" class="layer-text">Layer 01-05</text>
  <text x="100" y="108" text-anchor="middle" class="layer-text">C2 Implant</text>

  <rect x="160" y="70" width="100" height="35" rx="5" fill="url(#layerGrad)" />
  <text x="210" y="92" text-anchor="middle" class="layer-text">Layer 06-10</text>
  <text x="210" y="108" text-anchor="middle" class="layer-text">Evasion</text>

  <rect x="270" y="70" width="100" height="35" rx="5" fill="url(#layerGrad)" />
  <text x="320" y="92" text-anchor="middle" class="layer-text">Layer 11-15</text>
  <text x="320" y="108" text-anchor="middle" class="layer-text">Credential</text>

  <rect x="380" y="70" width="100" height="35" rx="5" fill="url(#layerGrad)" />
  <text x="430" y="92" text-anchor="middle" class="layer-text">Layer 16-25</text>
  <text x="430" y="108" text-anchor="middle" class="layer-text">Exploit/Crypto</text>

  <rect x="490" y="70" width="100" height="35" rx="5" fill="url(#layerGrad)" />
  <text x="540" y="92" text-anchor="middle" class="layer-text">Layer 26-40</text>
  <text x="540" y="108" text-anchor="middle" class="layer-text">AI/Cloud</text>

  <rect x="600" y="70" width="100" height="35" rx="5" fill="url(#layerGrad)" />
  <text x="650" y="92" text-anchor="middle" class="layer-text">Layer 41-60</text>
  <text x="650" y="108" text-anchor="middle" class="layer-text">Web/Net</text>

  <rect x="710" y="70" width="80" height="35" rx="5" fill="url(#layerGrad)" />
  <text x="750" y="92" text-anchor="middle" class="layer-text">Layer</text>
  <text x="750" y="108" text-anchor="middle" class="layer-text">61-70</text>

  <!-- Event bus line -->
  <line x1="50" y1="140" x2="790" y2="140" stroke="#44aaff" stroke-width="2" opacity="0.4" stroke-dasharray="10,5">
    <animate attributeName="stroke-dashoffset" values="0;15" dur="1s" repeatCount="indefinite" />
  </line>

  <!-- Target -->
  <rect x="680" y="170" width="140" height="80" rx="40" fill="url(#targetGrad)" filter="url(#glow)" class="target-pulse" />
  <text x="750" y="195" text-anchor="middle" fill="white" font-family="Arial" font-size="9" font-weight="bold">TARGET</text>
  <text x="750" y="210" text-anchor="middle" fill="white" font-family="Arial" font-size="9">BREACHED</text>
  <circle cx="750" cy="260" r="12" fill="#ff4444" class="target-pulse" />
  <text x="750" y="265" text-anchor="middle" fill="white" font-family="Arial" font-size="6">ACTIVE</text>

  <!-- Attack particles -->
  <circle r="5" fill="#ff4444" filter="url(#glow)" class="attack-dot">
    <animateMotion path="M100,120 Q250,90 400,120 Q550,150 700,180" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#ff8800" filter="url(#glow)" class="attack-dot">
    <animateMotion path="M210,120 Q400,80 600,130 Q680,160 750,200" dur="3.5s" begin="0.5s" repeatCount="indefinite" />
  </circle>
  <circle r="3" fill="#ffaa00" filter="url(#glow)" class="attack-dot">
    <animateMotion path="M320,120 Q500,100 650,140 Q720,170 780,210" dur="2.8s" begin="1s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#44aaff" filter="url(#glow)" class="attack-dot">
    <animateMotion path="M430,120 Q550,85 700,130 Q740,155 750,190" dur="4s" begin="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Scan line -->
  <rect x="0" y="0" width="800" height="3" fill="#ff4444" opacity="0.6" class="scan-line" />

  <!-- Event bus flow -->
  <circle r="3" fill="#44aaff">
    <animateMotion path="M60,150 Q200,130 400,150 Q600,170 740,145" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle r="3" fill="#44aaff">
    <animateMotion path="M60,150 Q200,130 400,150 Q600,170 740,145" dur="4s" begin="1.3s" repeatCount="indefinite" />
  </circle>
  <circle r="3" fill="#44aaff">
    <animateMotion path="M60,150 Q200,130 400,150 Q600,170 740,145" dur="4s" begin="2.6s" repeatCount="indefinite" />
  </circle>

  <!-- Bottom stats -->
  <rect x="50" y="320" width="700" height="40" rx="8" fill="#0d1117" stroke="#44aaff" stroke-width="1" opacity="0.8" />
  <text x="400" y="342" text-anchor="middle" fill="#44aaff" font-family="Arial" font-size="13" font-weight="bold">EVENT BUS — 96 Modules Connected | 70 Layers Real-time Orchestration</text>
  <text x="400" y="362" text-anchor="middle" fill="#666" font-family="Arial" font-size="10">AES-256 Encrypted | ECDH Key Exchange | Cross-Module Publish/Subscribe</text>

  <!-- Footer -->
  <text x="400" y="392" text-anchor="middle" fill="#444" font-family="Arial" font-size="9">ANGEL Platform — Offensive Security Framework</text>
</svg>
