<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANGEL Platform v3.3 — Attack Visualization</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
  canvas { display: block; }
  #ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  .header { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); text-align: center; }
  .header h1 { font-size: 36px; color: #00ff41; letter-spacing: 6px; text-shadow: 0 0 20px #00ff41; animation: glow 2s infinite alternate; }
  @keyframes glow { from { text-shadow: 0 0 10px #00ff41; } to { text-shadow: 0 0 40px #00ff41, 0 0 80px #00ff41; } }
  .header .sub { font-size: 12px; color: #8b949e; letter-spacing: 3px; margin-top: 5px; }
  .status-bar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; background: rgba(0,20,0,0.8); border: 1px solid #00ff41; padding: 10px 25px; border-radius: 4px; }
  .status-item { text-align: center; }
  .status-item .label { font-size: 9px; color: #8b949e; text-transform: uppercase; }
  .status-item .val { font-size: 16px; color: #00ff41; font-weight: bold; }
  .alert { position: absolute; top: 80px; right: 30px; background: rgba(255,0,0,0.1); border: 1px solid #ff0000; padding: 10px 15px; color: #ff0000; font-size: 12px; animation: alertPulse 1s infinite; border-radius: 4px; }
  @keyframes alertPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; border-color: #ff6600; } }
  .phase { position: absolute; top: 80px; left: 30px; color: #00ff41; font-size: 14px; letter-spacing: 2px; }
  .phase .num { font-size: 32px; font-weight: bold; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="header">
    <h1>🛡️ ANGEL PLATFORM</h1>
    <div class="sub">OFFENSIVE SECURITY — ATTACK VISUALIZATION</div>
  </div>
  <div class="phase">
    <span class="num" id="phaseNum">1</span>
    <span id="phaseName">INITIALIZING</span>
  </div>
  <div class="alert" id="alert">⚠ UNAUTHORIZED ACCESS DETECTED</div>
  <div class="status-bar">
    <div class="status-item"><div class="label">Modules</div><div class="val" id="sModules">0/83</div></div>
    <div class="status-item"><div class="label">Layers</div><div class="val" id="sLayers">0/70</div></div>
    <div class="status-item"><div class="label">Tests</div><div class="val" id="sTests">0/92</div></div>
    <div class="status-item"><div class="label">Status</div><div class="val" id="sStatus">...</div></div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

const phases = [
  { num: 1, name: 'INITIALIZING', duration: 3 },
  { num: 2, name: 'SCANNING NETWORK', duration: 4 },
  { num: 3, name: 'FINDING VULNERABILITY', duration: 3 },
  { num: 4, name: 'EXPLOITING', duration: 3 },
  { num: 5, name: 'ESCALATING PRIVILEGES', duration: 3 },
  { num: 6, name: 'EXFILTRATING DATA', duration: 4 },
  { num: 7, name: 'COVERING TRACKS', duration: 3 },
  { num: 8, name: 'MISSION COMPLETE', duration: 5 }
];

let currentPhase = 0, phaseStartTime = Date.now(), particles = [], nodes = [], lines = [];
let scanAngle = 0, attackWave = 0, time = 0;
let matrixDrops = [];
const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%^&*()_+-=[]{}|;:,.<>?';

for (let i = 0; i < 100; i++) {
  matrixDrops.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, speed: Math.random() * 3 + 1, char: chars[Math.floor(Math.random() * chars.length)], length: Math.random() * 20 + 5 });
}

function initNodes() {
  nodes = [];
  const cx = canvas.width / 2, cy = canvas.height / 2;
  nodes.push({ x: cx, y: cy, r: 20, type: 'core', hp: 100, compromised: false, pulse: 0 });
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI * 2 / 6) * i, dist = 150;
    nodes.push({ x: cx + Math.cos(angle) * dist, y: cy + Math.sin(angle) * dist, r: 12, type: 'server', hp: 100, compromised: false, pulse: 0 });
  }
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 / 12) * i, dist = 280;
    nodes.push({ x: cx + Math.cos(angle) * dist, y: cy + Math.sin(angle) * dist, r: 8, type: 'workstation', hp: 100, compromised: false, pulse: 0 });
  }
  for (let i = 0; i < 20; i++) {
    const angle = (Math.PI * 2 / 20) * i + 0.1, dist = 400;
    nodes.push({ x: cx + Math.cos(angle) * dist, y: cy + Math.sin(angle) * dist, r: 5, type: 'target', hp: 100, compromised: false, pulse: 0 });
  }
  lines = [];
  for (let i = 1; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
      if (Math.sqrt(dx*dx + dy*dy) < 200) lines.push({ from: i, to: j, active: false, pulse: 0 });
    }
  }
}

function addParticle(x, y, color, vx, vy, life) {
  particles.push({ x, y, color, vx: vx || (Math.random() - 0.5) * 4, vy: vy || (Math.random() - 0.5) * 4, life, maxLife: life, size: Math.random() * 3 + 1 });
}

function explode(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2, speed = Math.random() * 6 + 2;
    addParticle(x, y, color, Math.cos(angle) * speed, Math.sin(angle) * speed, Math.random() * 40 + 20);
  }
}

function drawMatrix() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#00ff41';
  ctx.font = '12px Courier New';
  for (const d of matrixDrops) {
    ctx.globalAlpha = 0.3;
    ctx.fillText(d.char, d.x, d.y);
    d.y += d.speed;
    if (d.y > canvas.height) { d.y = -10; d.x = Math.random() * canvas.width; d.char = chars[Math.floor(Math.random() * chars.length)]; }
  }
  ctx.globalAlpha = 1;
}

function drawNetwork() {
  for (const l of lines) {
    const a = nodes[l.from], b = nodes[l.to];
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = l.active ? 'rgba(0, 255, 65, 0.6)' : 'rgba(0, 255, 65, 0.1)';
    ctx.lineWidth = l.active ? 2 : 1; ctx.stroke();
    if (l.active) {
      l.pulse += 0.05;
      const px = a.x + (b.x - a.x) * (Math.sin(l.pulse) * 0.5 + 0.5);
      const py = a.y + (b.y - a.y) * (Math.sin(l.pulse) * 0.5 + 0.5);
      ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI * 2); ctx.fillStyle = '#00ff41'; ctx.fill();
    }
  }
  for (const n of nodes) {
    n.pulse += 0.03;
    const pulseR = n.r + Math.sin(n.pulse) * 2;
    if (n.compromised) {
      ctx.beginPath(); ctx.arc(n.x, n.y, pulseR + 10, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255, 0, 0, 0.2)'; ctx.fill();
      ctx.beginPath(); ctx.arc(n.x, n.y, pulseR, 0, Math.PI * 2); ctx.fillStyle = '#ff0000'; ctx.fill();
    } else {
      const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, pulseR * 2);
      grad.addColorStop(0, n.type === 'core' ? 'rgba(0, 255, 65, 0.4)' : 'rgba(0, 200, 255, 0.2)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.beginPath(); ctx.arc(n.x, n.y, pulseR * 2, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill();
      ctx.beginPath(); ctx.arc(n.x, n.y, pulseR, 0, Math.PI * 2); ctx.fillStyle = n.type === 'core' ? '#00ff41' : '#00ccff'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(n.x, n.y, pulseR, 0, Math.PI * 2);
    ctx.strokeStyle = n.compromised ? '#ff0000' : (n.type === 'core' ? '#00ff41' : '#00ccff');
    ctx.lineWidth = n.type === 'core' ? 2 : 1; ctx.stroke();
  }
}

function drawAttackWave() {
  attackWave += 0.02;
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const radius = 50 + attackWave * 200;
  const alpha = Math.max(0, 1 - attackWave);
  if (alpha <= 0) return;
  ctx.beginPath(); ctx.arc(cx, cy, radius % 500, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(255, 0, 0, ${alpha * 0.5})`; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, (radius + 150) % 500, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(255, 0, 0, ${alpha * 0.3})`; ctx.lineWidth = 2; ctx.stroke();
}

function drawScanLine() {
  scanAngle += 0.01;
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const len = Math.max(canvas.width, canvas.height);
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(scanAngle) * len, cy + Math.sin(scanAngle) * len);
  ctx.strokeStyle = 'rgba(0, 255, 65, 0.1)'; ctx.lineWidth = 1; ctx.stroke();
  const tx = cx + Math.cos(scanAngle) * len, ty = cy + Math.sin(scanAngle) * len;
  const grad = ctx.createRadialGradient(tx, ty, 0, tx, ty, 20);
  grad.addColorStop(0, 'rgba(0, 255, 65, 0.5)'); grad.addColorStop(1, 'rgba(0, 255, 65, 0)');
  ctx.beginPath(); ctx.arc(tx, ty, 20, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill();
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vx *= 0.98; p.vy *= 0.98; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fillStyle = p.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
    ctx.fill();
  }
}

let nodesCompromised = 0, testProgress = 0;

function animate() {
  time++;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawMatrix(); drawScanLine(); drawAttackWave(); drawNetwork(); drawParticles();

  const phaseTime = (Date.now() - phaseStartTime) / 1000;
  const phase = phases[currentPhase];
  if (phaseTime > phase.duration) {
    currentPhase = (currentPhase + 1) % phases.length;
    phaseStartTime = Date.now();
    const np = phases[currentPhase];
    document.getElementById('phaseNum').textContent = np.num;
    document.getElementById('phaseName').textContent = np.name;
    if (np.num === 2) { for (const l of lines) l.active = true; }
    else if (np.num === 4) { for (let i = 1; i < nodes.length; i += 2) { nodes[i].compromised = true; explode(nodes[i].x, nodes[i].y, '#ff0000', 15); } }
    else if (np.num === 6) { for (const n of nodes) n.compromised = true; explode(canvas.width/2, canvas.height/2, '#ff0000', 50); }
    else if (np.num === 8) { for (const n of nodes) { explode(n.x, n.y, '#ff0000', 20); explode(n.x, n.y, '#ffaa00', 10); } }
  }

  nodesCompromised = nodes.filter(n => n.compromised).length;
  testProgress = Math.min(100, (phaseTime / phase.duration) * 100);
  document.getElementById('sModules').textContent = Math.floor(testProgress * 0.83) + '/83';
  document.getElementById('sLayers').textContent = Math.floor(testProgress * 0.7) + '/70';
  document.getElementById('sTests').textContent = Math.floor(testProgress * 0.92) + '/92';
  document.getElementById('sStatus').textContent = phase.name;

  requestAnimationFrame(animate);
}

initNodes();
phaseStartTime = Date.now();
animate();

window.addEventListener('click', (e) => {
  explode(e.clientX, e.clientY, '#ff0000', 20);
  explode(e.clientX, e.clientY, '#ffaa00', 10);
  addParticle(e.clientX, e.clientY, '#ff0000', 0, 0, 40);
  let closest = null, closestDist = Infinity;
  for (const n of nodes) { const d = Math.hypot(n.x - e.clientX, n.y - e.clientY); if (d < closestDist) { closestDist = d; closest = n; } }
  if (closest && closestDist < 100) { closest.compromised = true; explode(closest.x, closest.y, '#ff0000', 30); }
});

window.addEventListener('mousemove', (e) => {
  if (Math.random() > 0.7) addParticle(e.clientX, e.clientY, 'rgb(0, 255, 65)', (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, 20);
});
<\/script>
</body>
</html>'''
