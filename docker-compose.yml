services:
  angel-teamserver:
    build:
      context: .
      dockerfile: Dockerfile.angel
    image: angel:latest
    container_name: angel-teamserver
    env_file:
      - lab/configs/lab.env
    ports:
      - "8080:8080"
      - "8443:8443"
      - "443:443"
      - "5353:53/udp"
      - "4455:445"
    volumes:
      - ./lab/data:/app/data
      - ./lab/logs:/app/logs
      - ./lab/implants:/app/implants
      - ./lab/certs:/app/certs
    environment:
      TEAMSERVER_ADDR: "0.0.0.0"
      TEAMSERVER_PORT: "8443"
      DATABASE_URL: "sqlite:///data/angel.db"
      DATABASE_ENCRYPTION_KEY: "${DATABASE_ENCRYPTION_KEY}"
      TLS_CERT_FILE: "/app/certs/server.crt"
      TLS_KEY_FILE: "/app/certs/server.key"
      LOG_LEVEL: "debug"
      LOG_FILE: "/app/logs/angel.log"
      C2_DEFAULT_PROFILE: "teams"
      C2_DEFAULT_SLEEP: "30s"
      C2_DEFAULT_JITTER: "0.25"
      C2_MAX_AGENTS: "100"
      LISTENER_HTTPS_PORT: "8443"
      LISTENER_DNS_PORT: "8444"
      LISTENER_SMB_PORT: "4455"
      LISTENER_WEBSOCKET_PORT: "9443"
      ENCRYPTION_ALGORITHM: "aes-256-gcm"
      ENCRYPTION_KEY_ROTATION: "24h"
      SUPABASE_URL: "${SUPABASE_URL:-http://localhost:54321}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:-anon-key-default}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-service-role-default}"
    networks:
      - angel-net
    restart: unless-stopped
    command: ["-bind", "0.0.0.0", "-port", "8443"]
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:8443/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  angel-console:
    build:
      context: .
      dockerfile: Dockerfile.console
    image: angel-console:latest
    container_name: angel-console
    env_file:
      - lab/configs/lab.env
    ports:
      - "3000:3000"
    volumes:
      - ./lab/data:/app/data
    environment:
      TEAMSERVER_ADDR: "http://angel-teamserver:8080"
      API_GATEWAY_ADDR: "0.0.0.0"
      API_GATEWAY_PORT: "3000"
      FRONTEND_URL: "http://localhost:4200"
      FRONTEND_API_URL: "http://localhost:8080"
    networks:
      - angel-net
    restart: unless-stopped
    depends_on:
      - angel-teamserver
    command: ["-addr", "0.0.0.0", "-port", "3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  angel-rules:
    build:
      context: .
      dockerfile: Dockerfile.rules
    image: angel-rules:latest
    container_name: angel-rules
    env_file:
      - lab/configs/lab.env
    volumes:
      - ./lab/data:/app/data
    environment:
      SUPABASE_URL: "${SUPABASE_URL:-http://localhost:54321}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:-anon-key-default}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-service-role-default}"
      LOG_LEVEL: "info"
    networks:
      - angel-net
    restart: unless-stopped
    command: ["-bind", "0.0.0.0", "-port", "9444"]
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:9444/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: angel-dvwa
    ports:
      - "8081:80"
    environment:
      PHP_DISPLAY_ERRORS: "On"
      DVWA_CONTEXT: "dvwa"
    networks:
      - angel-net
    restart: unless-stopped

networks:
  angel-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16