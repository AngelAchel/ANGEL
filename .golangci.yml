version: "2"

run:
  timeout: 30m
  modules-download-mode: readonly
  tests: false

issues:
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 5
  exclude-files:
    - '_test\.go'
  exclude-dirs:
    - vendor
    - node_modules
    - frontend
    - bin
    - lab
  exclude-dirs-regexp:
    - '.*/frontend/.*'
  exclude-rules:
    - path: 'vendor/'
      linters:
        - errcheck
        - staticcheck

linters:
  enable:
    - errcheck
    - ineffassign
    - staticcheck
    - unused
    - govet
    - misspell
  disable:
    - nakedret
    - prealloc
    - unconvert
    - depguard
    - revive

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefix: github.com/angel-platform/angel

output:
  formats:
    colored-line-number: {}
  print-issued-lines: true