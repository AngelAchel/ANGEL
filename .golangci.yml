version: "1"

run:
  timeout: 30m
  modules-download-mode: readonly
  tests: true
  skip-dirs:
    - vendor
    - node_modules
    - frontend
    - bin
    - lab
  skip-dirs-regexp:
    - '.*/frontend/.*'
  skip-files:
    - _test.go

linters:
  enable:
    - errcheck
    - ineffassign
    - staticcheck
    - unused
    - govet
    - misspell
  disable:
    - nakedret
    - prealloc
    - unconvert
    - depguard
    - revive

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefix: github.com/angel-platform/angel

issues:
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 5
  exclude-rules:
    - path: '_test\.go'
      linters:
        - errcheck
        - nakedret
    - path: 'vendor/'
      linters:
        - errcheck
        - staticcheck

output:
  formats: colored-line-number
  print-issued-lines: true