# ANGEL Platform golangci-lint configuration
# v2.13.2 compatible

version: "2"

run:
  timeout: 30m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - ineffassign
    - staticcheck
  disable:
    - unused

issues:
  exclude-rules:
    # Exclude errcheck dari semua test files
    - path: "_test\\.go"
      linters:
        - errcheck

    # Exclude errcheck dari file non-test yang error-nya tidak kritis
    - path: "c2/generate/generator\\.go"
      linters:
        - errcheck
    - path: "modules/layer01-05/resilience/self_destruct\\.go"
      linters:
        - errcheck
    - path: "pkg/logger/logger\\.go"
      linters:
        - errcheck
    - path: "c2/implant/implant\\.go"
      linters:
        - errcheck
    - path: "cmd/console/main\\.go"
      linters:
        - errcheck
    - path: "modules/layer01-05/c2listener/c2_channel_test\\.go"
      linters:
        - errcheck
    - path: "modules/layer01-05/c2listener/encryption\\.go"
      linters:
        - errcheck
    - path: "modules/layer01-05/c2listener/listener\\.go"
      linters:
        - errcheck
    - path: "modules/layer01-05/decoy/decoy\\.go"
      linters:
        - errcheck
    - path: "modules/layer01-05/decoy/honeypot\\.go"
      linters:
        - errcheck
    - path: "modules/layer01-05/server/database/sqlite\\.go"
      linters:
        - errcheck
    - path: "modules/layer01-05/server/server\\.go"
      linters:
