    - path: "modules/layer06-10/persistence/darwin\\.go"
      linters:
        - errcheck
    - path: "modules/layer06-10/persistence/windows\\.go"
      linters:
        - errcheck
    - path: "modules/layer06-10/rootkit/firmware\\.go"
      linters:
        - errcheck
    - path: "modules/layer06-10/rootkit/smm\\.go"
      linters:
        - errcheck
    - path: "modules/layer11-15/collector/collector_test\\.go"
