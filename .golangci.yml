version: "2"

run:
  timeout: 30m
  modules-download-mode: readonly
  tests: false

linters:
  enable:
    - errcheck
    - ineffassign
    - staticcheck
    - unused
    - govet
    - misspell
    - nakedret
    - prealloc
    - unconvert
  disable:
    - depguard
    - revive

issues:
  exclude-use-default: true
  max-issues-per-linter: 50
  max-same-issues: 5